name: Release

# Builds a draft GitHub release when a version tag is pushed. Obsidian's community store installs
# the plugin from a release's main.js, manifest.json and styles.css, and expects the tag to be the
# bare version (0.1.0, not v0.1.0). Publishing the draft, and submitting to the store, stay manual.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the tag matches the manifest
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match manifest.json's version $version." >&2
            exit 1
          fi
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
            --draft --title "$GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md for what changed in $GITHUB_REF_NAME."
